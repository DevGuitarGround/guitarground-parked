<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GuitarGround — back soon</title>
<meta name="description" content="GuitarGround is taking a short break. We'll be back soon.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0e0d0c; --ink:#f3ede4; --muted:#a39a8e; --accent:#e8a33d; --line:#2a2622; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--ink);
    font:400 17px/1.6 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    display:grid; place-items:center; padding:24px 16px;
  }
  main { width:100%; max-width:560px; text-align:center; }
  .strings { display:grid; gap:7px; margin:0 auto 40px; width:min(320px,80%); }
  .strings span { display:block; height:1px; background:var(--line); }
  .strings span:nth-child(1){ height:1px } .strings span:nth-child(2){ height:1px }
  .strings span:nth-child(3){ height:2px } .strings span:nth-child(4){ height:2px; background:var(--accent) }
  .strings span:nth-child(5){ height:3px } .strings span:nth-child(6){ height:3px }
  h1 {
    font:400 clamp(56px,14vw,104px)/0.9 "Bebas Neue", Impact, "Arial Narrow", sans-serif;
    letter-spacing:0.02em; margin:0 0 20px; text-wrap:balance;
  }
  h1 em { font-style:normal; color:var(--accent); }
  p { margin:0 auto; max-width:42ch; color:var(--muted); }
  .note { margin-top:36px; font-size:13px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="strings" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <h1>Guitar<em>Ground</em><br>is tuning up</h1>
  <p>We're taking a short break to restring the stage. Your profile, videos and battles are safely backed up — and we'll be back soon.</p>
  <div class="note">See you on the stage</div>
</main>
</body>
</html>
